# Cross-platform wheel build smoke for push to main/develop and PRs.
# Intentionally minimal (x86_64 linux + x64 windows) — the full matrix
# runs only on tag push via .github/workflows/release.yml.
#
# Originally seeded by `maturin generate-ci github` (v1.13.1); since
# trimmed by hand, so do NOT regenerate from maturin.
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter
          sccache: true
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
          sccache: true
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  # PyPI publishing has been removed by design. Tag-triggered releases
  # are handled exclusively by .github/workflows/release.yml, which
  # uploads wheels + sdist to GitHub Releases (not PyPI).
