name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (cargo fmt / clippy / test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (nightly per rust-toolchain.toml)
        # rust-toolchain.toml pins channel = "nightly" because Cargo.toml
        # enables the pyo3 "nightly" feature. Install nightly with rustfmt +
        # clippy so the override file doesn't strand cargo on a component-less
        # toolchain.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Set up Python 3.12 (required by pyo3 abi3-py312)
        # pyo3's build script links against libpython at compile time. Without
        # this, cargo clippy/test on ubuntu-22.04 picks up Python 3.10 and
        # fails: "cannot set a minimum Python version 3.12 higher than the
        # interpreter version 3.10".
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # `--all-targets` covers tests + bins; `-D warnings` makes any warning fail.
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --lib
        # Lib-only: a real SLURM cluster is not available in CI. The unit suite
        # covers all parsers, dispatchers, and the SlurmManager argv plumbing
        # (TokioDispatcher uses the coreutils `true`/`false`/`echo` binaries).
        run: cargo test --lib

  python:
    name: Python (maturin develop + pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (nightly per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-test

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync uv environment
        run: uv sync --all-extras

      - name: maturin develop (build & install extension)
        run: uv run maturin develop

      - name: pytest
        run: uv run pytest python/tests -v

      - name: ruff check
        run: uv run ruff check python/

      - name: ruff format --check
        run: uv run ruff format --check python/

      - name: Stub drift check (regenerate .pyi and diff)
        # The committed auto-generated stubs must match the current Rust
        # source. stub_gen emits unformatted output, so normalize with ruff
        # format (same sequence as the documented regeneration command)
        # before diffing. The preceding `ruff format --check` already proved
        # the tree was formatted, so any diff here is stub drift, not
        # formatting noise.
        run: |
          cargo run --bin stub_gen
          uv run ruff format python/
          git diff --exit-code python/

  audit:
    name: Security advisories (cargo audit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        # Reads Cargo.lock only — no compilation, so no Rust toolchain step.
        # `cargo-audit audit` (direct binary) skips the `cargo audit` rustup
        # shim, which would otherwise install the nightly toolchain pinned by
        # rust-toolchain.toml just to dispatch the subcommand.
        # Ignored advisories are listed in .cargo/audit.toml with justification.
        run: cargo-audit audit
