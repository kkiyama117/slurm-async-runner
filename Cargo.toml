[package]
name = "slurm_async_runner"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# "cdylib" is necessary to produce a shared library for Python to import from.
# "rlib" is required so stub_gen binary can link against this crate.
# `name` omitted; cargo defaults to the package name. Python-facing module path
# is controlled separately via `[tool.maturin] module-name` in `pyproject.toml`.
[lib]
crate-type = ["cdylib", "rlib"]
name = "slurm_async_runner"

[[bin]]
name = "stub_gen"
required-features = ["stub_gen"]

[dependencies]
# Simplified error handling
anyhow = "1.0"
thiserror = "2.0"

# `async fn` in object-safe traits (`dyn JobStateStore`). Edition 2024
# supports AFIT for static dispatch, but `dyn Trait` for an async-fn
# trait still requires this macro-based desugaring.
async-trait = "0.1"

# Logging and tracing
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

# Asynchronous runtime and utilities
futures = "0.3"
tokio = { version = "1.0", features = [
  "macros",
  "process",
  "rt-multi-thread",
  "sync",       # watch, Mutex
  "fs",         # tokio::fs::File / read
  "io-util",    # AsyncBufReadExt::lines
  "time",       # tokio::time::timeout in tests
] }

chrono = { version = "0.4", features = ["serde"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
itertools = "0.14.0"
toml = "1.1.2"

# UUID and datetime
uuid = { version = "1.23", features = ["serde", "v4", "v7"] }

# Shared Gaussian job entities (Job, JobSpec, SlurmJobConfig, JobStatus,
# JobState, JobReason, ResourceSpec, JobTimeLimit). We enable
# `pyo3-types` so the pyclass wrappers (PyResourceSpec, PyJobTimeLimit,
# etc.) are linked into our extension, but NOT the upstream
# `pymodule-entry` feature — that would emit a
# `PyInit__gaussian_job_shared_core` symbol that we don't want in our
# `.so`. The shared2 wheel still ships its own
# `_gaussian_job_shared_core` extension separately for direct Python
# users.
gaussian_job_shared = { git = "https://github.com/kkiyama117/gaussian_job_shared", rev = "299d3e80d73b1533e4dd7c5f4fdde000c7be1aae", default-features = false, features = ["pyo3-types"] }

##### OPTIONAL DEPS #####
# PYO3
pyo3 = { version = "0.28", features = [
  "abi3-py312",
  # Connection to other useful crates
  "anyhow",
  "chrono",
  "experimental-inspect",
  # NOTE: "extension-module" is intentionally NOT enabled here. Enable it
  # per-package via `[tool.maturin] features = ["pyo3/extension-module"]` in
  # each maturin-built package's pyproject.toml. Keeping it out of the default
  # workspace feature set allows the `stub_gen` binary in each package to link
  # against libpython.
  # NOTE: "auto-initialize" is intentionally NOT enabled. It conflicts with
  # the statically-linked Python that maturin's manylinux build images ship,
  # producing the build-script error "auto-initialize feature is enabled, but
  # your python installation only supports embedding the Python interpreter
  # statically". stub_gen does not need it (abi3 dynamic linking via
  # libpython3.so is sufficient at run time).
  "nightly",
  # "eyre",
  "serde",
], optional = true }
pyo3-async-runtimes = { version = "0.28", features = [
  "attributes",
  "tokio-runtime"
], optional = true }
pyo3-log = { version = "0.13", optional = true }
pythonize = { version = "0.28", optional = true }

# STUB_GEN
pyo3-stub-gen = { git = "https://github.com/Jij-Inc/pyo3-stub-gen", branch = "main", default-features = false, features = [
  "infer_signature"
], optional = true }

[features]
default = ["pyo3", "stub_gen"]

pyo3 = ["dep:pyo3", "pyo3-async-runtimes", "pyo3-log", "pythonize"]
stub_gen = ["pyo3-stub-gen"]
