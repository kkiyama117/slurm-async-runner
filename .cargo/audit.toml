# cargo-audit configuration — keeps local `cargo audit` and the CI job in sync.

[advisories]
# pyo3 0.28.x advisories, both patched only in pyo3 >= 0.29.0. Upgrading is a
# coordinated bump of pyo3 + pyo3-async-runtimes + pyo3-log + pythonize +
# pyo3-stub-gen (tracked as an issue #16 follow-up), not a one-line fix.
# Exposure check (2026-06-12): neither pattern is used in this crate —
# - RUSTSEC-2026-0176: OOB read in `nth`/`nth_back` on PyList/PyTuple iterators
#   (no `.nth(`/`nth_back` calls in src/)
# - RUSTSEC-2026-0177: missing `Sync` bound on `PyCFunction::new_closure`
#   (no `new_closure` calls in src/)
ignore = [
  "RUSTSEC-2026-0176",
  "RUSTSEC-2026-0177",
]
